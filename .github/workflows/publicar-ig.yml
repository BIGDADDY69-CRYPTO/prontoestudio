name: Publicar en Instagram

on:
  schedule:
    - cron: "0 15 * * *"   # 12:00 de Argentina, todos los días
  workflow_dispatch:
    inputs:
      fecha:
        description: "AAAA-MM-DD (vacío = hoy)"
        required: false

permissions:
  contents: write

concurrency:
  group: publicar-ig
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar el posteo del día
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FECHA: ${{ github.event.inputs.fecha }}
        run: |
          if [ -n "$FECHA" ]; then python publicar_ig.py --fecha "$FECHA"; else python publicar_ig.py; fi
      - name: Guardar que se publicó
        run: |
          git config user.name "publicador-ig"
          git config user.email "publicador-ig@users.noreply.github.com"
          git add ig
          git diff --cached --quiet || (git commit -m "ig: publicado $(date -u +%F)" && git push)
